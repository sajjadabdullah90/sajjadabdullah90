<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
<title id="title">Animated developer network</title><desc id="desc">Glowing blue network nodes connected by lines with traveling data pulses.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060b18"/><stop offset=".55" stop-color="#101f42"/><stop offset="1" stop-color="#060d1b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="230" rx="18" fill="url(#bg)"/>
<g stroke="#3b82f6" stroke-opacity=".4" stroke-width="1.5" fill="none">
<path d="M45 38L135 80 220 36 305 82 380 40 465 78 535 35"/><path d="M45 180L135 145 220 195 305 150 380 192 465 148 535 190"/><path d="M135 80L135 145M220 36L220 195M305 82L305 150M380 40L380 192M465 78L465 148"/>
<path d="M1160 38L1070 80 985 36 900 82 825 40 740 78 665 35"/><path d="M1160 180L1070 145 985 195 900 150 825 192 740 148 665 190"/><path d="M1070 80L1070 145M985 36L985 195M900 82L900 150M825 40L825 192M740 78L740 148"/>
</g>
<g fill="#60a5fa" filter="url(#glow)">
<circle cx="135" cy="80" r="4"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle><circle cx="305" cy="82" r="4"><animate attributeName="r" values="4;7;4" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="465" cy="148" r="4"><animate attributeName="r" values="3;6;3" dur="1.9s" repeatCount="indefinite"/></circle><circle cx="1070" cy="80" r="4"><animate attributeName="r" values="3;6;3" dur="2.3s" repeatCount="indefinite"/></circle><circle cx="900" cy="150" r="4"><animate attributeName="r" values="4;7;4" dur="2.1s" repeatCount="indefinite"/></circle><circle cx="740" cy="78" r="4"><animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/></circle>
</g>
<g fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
<path d="M45 38L135 80 220 36 305 82" stroke-dasharray="12 360"><animate attributeName="stroke-dashoffset" from="372" to="0" dur="4s" repeatCount="indefinite"/></path>
<path d="M1160 180L1070 145 985 195 900 150" stroke-dasharray="12 360"><animate attributeName="stroke-dashoffset" from="372" to="0" dur="4.6s" repeatCount="indefinite"/></path>
