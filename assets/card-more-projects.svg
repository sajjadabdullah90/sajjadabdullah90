<svg xmlns="http://www.w3.org/2000/svg" width="452" height="291" viewBox="0 0 452 291" role="img" aria-label="More projects on GitHub" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A1A1A"/><stop offset="1" stop-color="#0A0A0B"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4A017"/><stop offset="1" stop-color="#D4A017"/></linearGradient>
  <linearGradient id="dv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D4A017" stop-opacity=".55"/><stop offset="1" stop-color="#D4A017" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4A017" stop-opacity=".34"/><stop offset="1" stop-color="#D4A017" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect x="1" y="1" width="438" height="277" rx="16"/></clipPath>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#D4A017"/></pattern>
  <linearGradient id="fade" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="dm"><rect width="440" height="279" fill="url(#fade)"/></mask>
</defs>
<g transform="translate(6 6)">
<rect x=".75" y=".75" width="438.5" height="277.5" rx="16" fill="url(#bg)" stroke="url(#bd)" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="7 6"/>
<g clip-path="url(#clip)">
<circle cx="410" cy="8" r="150" fill="url(#glow)"><animate attributeName="opacity" values=".5;1;.5" dur="6s" repeatCount="indefinite"/></circle>
<rect width="440" height="279" fill="url(#dots)" mask="url(#dm)" opacity=".16"/>
</g>
<text x="26" y="39" font-family="'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#D4A017">EXPLORE</text>
<text x="26" y="84" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21.5" font-weight="700" fill="#FFFFFF">More projects</text>
<rect x="26" y="104" width="388" height="1" fill="url(#dv)"/>
<text x="26" y="132" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#CBD5E1">Browse everything else I'm building and experimenting with,</text>
<text x="26" y="152" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#CBD5E1">from web apps and APIs to ML and graphics experiments.</text>
<rect x="26" y="221" width="183.6" height="32" rx="16" fill="url(#bd)"/>
<text x="117.8" y="241.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".6" fill="#FFFFFF">ALL REPOSITORIES →</text>
</g>
