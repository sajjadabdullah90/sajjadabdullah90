<svg xmlns="http://www.w3.org/2000/svg" width="452" height="291" viewBox="0 0 452 291" role="img" aria-label="Aetheria: The Floating Sanctuary project card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A1A1A"/><stop offset="1" stop-color="#0A0A0B"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4A017"/><stop offset="1" stop-color="#D4A017"/></linearGradient>
  <linearGradient id="dv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D4A017" stop-opacity=".55"/><stop offset="1" stop-color="#D4A017" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4A017" stop-opacity=".34"/><stop offset="1" stop-color="#D4A017" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect x="1" y="1" width="438" height="277" rx="16"/></clipPath>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#D4A017"/></pattern>
  <linearGradient id="fade" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="dm"><rect width="440" height="279" fill="url(#fade)"/></mask>
</defs>
<g transform="translate(6 6)">
<rect x=".75" y=".75" width="438.5" height="277.5" rx="16" fill="url(#bg)" stroke="url(#bd)" stroke-opacity="0.8" stroke-width="1.5"/>
<g clip-path="url(#clip)">
<rect width="440" height="3" fill="url(#bd)"/>
<circle cx="410" cy="8" r="150" fill="url(#glow)"><animate attributeName="opacity" values=".5;1;.5" dur="6s" repeatCount="indefinite"/></circle>
<rect width="440" height="279" fill="url(#dots)" mask="url(#dm)" opacity=".16"/>
</g>
<text x="26" y="39" font-family="'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#D4A017">PROJECT 04</text>
<rect x="260.8" y="22" width="153.2" height="24" rx="12" fill="#D4A017" fill-opacity=".18" stroke="#D4A017" stroke-opacity=".55"/>
<text x="337.4" y="38" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#F3D98B">VIEW REPOSITORY →</text>
<text x="26" y="84" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21.5" font-weight="700" fill="#FFFFFF">Aetheria: The Floating Sanctuary</text>
<rect x="26" y="104" width="388" height="1" fill="url(#dv)"/>
<text x="26" y="132" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#CBD5E1">A computer-graphics project exploring a stylized floating</text>
<text x="26" y="152" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#CBD5E1">sanctuary and 3D environment design.</text>
<rect x="26.0" y="229" width="129.7" height="24" rx="12" fill="#D4A017" fill-opacity=".14" stroke="#B87512" stroke-opacity=".5"/>
<text x="90.8" y="245" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#F3D98B">Computer Graphics</text>
<rect x="163.7" y="229" width="111.5" height="24" rx="12" fill="#D4A017" fill-opacity=".14" stroke="#B87512" stroke-opacity=".5"/>
<text x="219.5" y="245" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#F3D98B">3D Visualization</text>
<rect x="283.2" y="229" width="71.2" height="24" rx="12" fill="#D4A017" fill-opacity=".14" stroke="#B87512" stroke-opacity=".5"/>
<text x="318.8" y="245" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#F3D98B">OpenGL</text>
