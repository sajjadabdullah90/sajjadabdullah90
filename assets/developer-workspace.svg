<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Syed Abdullah — code to deployment</title>
  <desc id="desc">A unified animated developer workspace showing JavaScript application code beside a terminal building and checking the project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B16"/><stop offset="1" stop-color="#101F3B"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563EB" stop-opacity=".15"/><stop offset=".5" stop-color="#60A5FA" stop-opacity=".85"/><stop offset="1" stop-color="#2563EB" stop-opacity=".15"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563EB" stop-opacity="0"/><stop offset=".5" stop-color="#60A5FA" stop-opacity=".16"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></linearGradient>
    <clipPath id="clipCode"><rect x="35" y="77" width="550" height="250" rx="10"/></clipPath>
    <clipPath id="clipTerm"><rect x="615" y="77" width="550" height="250" rx="10"/></clipPath>
    <style>
      .mono{font-family:'Fira Code','Cascadia Code',Consolas,monospace;font-size:15px}
      .small{font-family:Consolas,monospace;font-size:12px}
      .muted{fill:#8293b3}.blue{fill:#60a5fa}.purple{fill:#c4b5fd}.green{fill:#86efac}.white{fill:#e5edff}
      .codeLine{opacity:0;animation:appear .45s ease-out forwards}
      .c1{animation-delay:.25s}.c2{animation-delay:.55s}.c3{animation-delay:.85s}.c4{animation-delay:1.15s}.c5{animation-delay:1.45s}.c6{animation-delay:1.75s}
      .termLine{opacity:0;animation:appear .45s ease-out forwards}
      .t1{animation-delay:.8s}.t2{animation-delay:1.5s}.t3{animation-delay:2.2s}.t4{animation-delay:2.9s}
      .cursor{animation:blink 1s steps(2,start) infinite}
      .scan{animation:scan 5s ease-in-out infinite}
      .pulse{animation:pulse 2.5s ease-in-out infinite}
      @keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
      @keyframes blink{to{visibility:hidden}}
      @keyframes scan{0%,100%{transform:translateY(0);opacity:.1}50%{transform:translateY(210px);opacity:.75}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="370" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="368" rx="17" fill="none" stroke="#29436f" stroke-width="1.5"/>
  <path d="M18 1H1182" stroke="url(#edge)" stroke-width="2"/>
  <text x="35" y="38" fill="#dbeafe" font-family="Consolas,monospace" font-size="17" font-weight="700">BUILD / TEST / SHIP</text>
  <text x="1165" y="38" class="small muted" text-anchor="end">SYED ABDULLAH · DEVELOPER WORKSPACE</text>
  <circle cx="1145" cy="37" r="4" fill="#4ade80" class="pulse"/>
  <rect x="35" y="57" width="550" height="270" rx="10" fill="#0b1020" stroke="#263a60"/>
  <rect x="615" y="57" width="550" height="270" rx="10" fill="#080e1c" stroke="#263a60"/>
  <path d="M35 91H585M615 91H1165" stroke="#263a60"/>
  <circle cx="54" cy="74" r="4" fill="#fb7185"/><circle cx="68" cy="74" r="4" fill="#fbbf24"/><circle cx="82" cy="74" r="4" fill="#4ade80"/>
  <text x="310" y="78" class="small muted" text-anchor="middle">src / app.js</text>
  <circle cx="634" cy="74" r="4" fill="#fb7185"/><circle cx="648" cy="74" r="4" fill="#fbbf24"/><circle cx="662" cy="74" r="4" fill="#4ade80"/>
  <text x="890" y="78" class="small muted" text-anchor="middle">terminal — bash</text>
  <g clip-path="url(#clipCode)" class="mono">
    <rect x="35" y="92" width="550" height="235" fill="url(#glow)"/>
    <text x="55" y="122" class="muted">01</text><text x="87" y="122" class="purple codeLine c1">const</text><text x="143" y="122" class="blue codeLine c1">developer</text><text x="242" y="122" class="white codeLine c1"> = {</text>
    <text x="55" y="153" class="muted">02</text><text x="105" y="153" class="blue codeLine c2">name:</text><text x="165" y="153" class="green codeLine c2"> "Syed Abdullah",</text>
    <text x="55" y="184" class="muted">03</text><text x="105" y="184" class="blue codeLine c3">focus:</text><text x="165" y="184" class="green codeLine c3"> ["Full-stack", "AI/ML"],</text>
    <text x="55" y="215" class="muted">04</text><text x="105" y="215" class="blue codeLine c4">builds:</text><text x="178" y="215" class="green codeLine c4"> "Practical applications",</text>
    <text x="55" y="246" class="muted">05</text><text x="105" y="246" class="blue codeLine c5">values:</text><text x="178" y="246" class="green codeLine c5"> ["Quality", "Security"],</text>
    <text x="55" y="277" class="muted">06</text><text x="87" y="277" class="white codeLine c6">};</text>
    <rect x="122" y="289" width="8" height="17" rx="1" fill="#60a5fa" class="cursor"/>
  </g>
  <g clip-path="url(#clipTerm)" class="mono">
    <rect x="615" y="92" width="550" height="235" fill="url(#glow)"/>
    <text x="637" y="122" class="blue">abdullah@dev</text><text x="757" y="122" class="muted">:~$ </text><text x="797" y="122" class="white">npm run build</text>
    <text x="637" y="153" class="green termLine t1">✔ Build completed successfully</text>
    <text x="637" y="184" class="blue termLine t2">abdullah@dev</text><text x="757" y="184" class="muted termLine t2">:~$ </text><text x="797" y="184" class="white termLine t2">npm test</text>
    <text x="637" y="215" class="green termLine t3">✔ Checks passed</text>
    <text x="637" y="246" class="blue termLine t4">abdullah@dev</text><text x="757" y="246" class="muted termLine t4">:~$ </text><text x="797" y="246" class="white termLine t4">git status</text>
    <text x="637" y="277" class="green termLine t4">✔ Ready for the next commit</text>
    <rect x="637" y="294" width="528" height="1" fill="url(#edge)" class="scan"/>
  </g>
  <text x="600" y="352" fill="#8293b3" font-family="Consolas,monospace" font-size="12" text-anchor="middle">FROM CLEAN CODE TO WORKING SOFTWARE</text>
</svg>