<svg xmlns="http://www.w3.org/2000/svg" width="512" height="92" viewBox="0 0 512 92" role="img" aria-label="Location: Karachi, Pakistan. Coordinates 24.86 degrees north, 67.00 degrees east. Time zone UTC+5, Pakistan Standard Time." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101C40"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
  <linearGradient id="dv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60A5FA" stop-opacity="0"/><stop offset=".5" stop-color="#60A5FA" stop-opacity=".6"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#60A5FA" stop-opacity=".38"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93C5FD" stop-opacity="0"/><stop offset=".5" stop-color="#93C5FD" stop-opacity=".16"/><stop offset="1" stop-color="#93C5FD" stop-opacity="0"/></linearGradient>
  <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
  <clipPath id="clip"><rect x="1" y="1" width="498" height="78" rx="22"/></clipPath>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#60A5FA"/></pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="dm"><rect width="500" height="80" fill="url(#fade)"/></mask>
</defs>
<g transform="translate(6 6)">
  <rect x=".75" y=".75" width="498.5" height="78.5" rx="22" fill="url(#bg)" stroke="url(#bd)" stroke-opacity=".85" stroke-width="1.5"/>
  <g clip-path="url(#clip)">
    <circle cx="46" cy="40" r="90" fill="url(#glow)"><animate attributeName="opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/></circle>
    <rect width="500" height="80" fill="url(#dots)" mask="url(#dm)" opacity=".2"/>
    <rect x="-140" y="0" width="140" height="80" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="640 0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pulsing radar rings -->
  <circle cx="46" cy="48" r="8" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="8;30" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="46" cy="48" r="8" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="8;30" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="46" cy="53" rx="9" ry="3" fill="#2563EB" opacity=".45"/>
  <!-- map pin -->
  <g transform="translate(46 38)">
    <path d="M0,-17 C-9.5,-17 -15,-10 -15,-3 C-15,7 0,22 0,22 C0,22 15,7 15,-3 C15,-10 9.5,-17 0,-17 Z" fill="url(#pin)" stroke="#DBEAFE" stroke-opacity=".7" stroke-width="1"/>
    <circle cx="0" cy="-3" r="5.5" fill="#0B1020"/>
    <circle cx="0" cy="-3" r="2.2" fill="#93C5FD"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="92" y="14" width="1" height="52" fill="url(#dv)"/>

  <!-- left text -->
  <text x="112" y="31" font-family="'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace" font-size="10" font-weight="600" letter-spacing="2.4" fill="#60A5FA">BASED IN</text>
  <text x="112" y="56" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Karachi, Pakistan</text>

  <!-- right block -->
  <text x="474" y="31" text-anchor="end" font-family="'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="500" letter-spacing=".6" fill="#93C5FD">24.86° N  ·  67.00° E</text>
  <rect x="362" y="40" width="112" height="24" rx="12" fill="#2563EB" fill-opacity=".18" stroke="#60A5FA" stroke-opacity=".55"/>
  <circle cx="378" cy="52" r="3" fill="#60A5FA"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="424" y="56" text-anchor="middle" font-family="'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="600" letter-spacing=".8" fill="#DBEAFE">PKT · UTC+5</text>
</g>
</svg>
