<svg xmlns="http://www.w3.org/2000/svg" width="452" height="291" viewBox="0 0 452 291" role="img" aria-label="Pakistan Agri-Market Price Predictor project card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
