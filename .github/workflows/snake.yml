name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sajjadabdullah90
          outputs: |
            dist/github-snake.svg?color_snake=#60A5FA&color_dots=#0B1020,#172554,#1E40AF,#2563EB,#60A5FA
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#60A5FA

      - name: Push SVGs to snake-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
